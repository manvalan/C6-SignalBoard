[env:esp32-c6-signalboard]
# Note: Phase 1 uses ESP32 for testing (Arduino framework)
# Production will target ESP32-C6 (with native ESP-IDF in Phase 2)
platform = espressif32@7.0.1
board = esp32dev
framework = arduino

# Compiler settings for C++20 and code quality
build_flags =
    -std=c++2a
    -Wall
    -Wextra
    -Wstrict-aliasing
    -Wno-unused-parameter
    -O2
    
# Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_key_up

# Upload settings
upload_speed = 460800
upload_resetmethod = ck

# Libraries required by SignalBoard v1.0
# (PCA9685 is driven by the in-tree custom driver, no external lib needed)
lib_deps =
    PubSubClient@2.8
    U8g2@2.35.18
    ESP32Encoder@0.10.2
    ArduinoJson@7.1.0
    
# LittleFS configuration for static web files
board_build.filesystem = littlefs

# Advanced settings
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L

# Define board-specific utilities (optional)
extra_scripts = 

; SignalBoard v1.0 - PlatformIO configuration
;
; Environments:
;   esp32-c6-devkitc-1  -> production target (ESP32-C6, Arduino core 3.x via pioarduino)
;   esp32dev-test       -> legacy test board (plain ESP32, Arduino core 2.x)

[platformio]
default_envs = esp32-c6-devkitc-1

; ===== Common settings =====
[env]
framework = arduino

# Compiler settings for C++20 and code quality
build_flags =
    -std=c++2a
    -Wall
    -Wextra
    -Wstrict-aliasing
    -Wno-unused-parameter
    -O2

# Serial monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_key_up

# LittleFS for static web files
board_build.filesystem = littlefs

# Libraries required by SignalBoard v1.0
# (PCA9685 is driven by the in-tree custom driver, no external lib needed)
lib_deps =
    PubSubClient@2.8
    ArduinoJson@7.1.0

; ===== Production target: ESP32-C6 =====
; Official PlatformIO platform ships Arduino core 2.x (no C6 support),
; so we use the community-maintained pioarduino fork (core 3.3.7 / IDF 5.5.2)
[env:esp32-c6-devkitc-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c6-devkitc-1
upload_speed = 460800
# 8 MB flash: OTA-capable layout (2x 3.3MB app + 1.5MB LittleFS)
board_build.partitions = default_8MB.csv

; ===== Legacy test board: ESP32 Dev Module =====
[env:esp32dev-test]
platform = espressif32@7.0.1
board = esp32dev
upload_speed = 460800
upload_resetmethod = ck
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
lib_deps =
    ${env.lib_deps}
    U8g2@2.35.18
    ESP32Encoder@0.10.2
